[workspace]
resolver = "2"
members = [
    "crates/voxli-core",
    "crates/voxli-config",
    "crates/voxli-audio",
    "crates/voxli-asr",
    "crates/voxli-text",
    "crates/voxli-hotkeys",
    "crates/voxli-storage",
    "crates/voxli-secure",
    "crates/voxli-license",
    "crates/voxli-diagnostics",
    "crates/voxli-win",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Voxli"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Profil de release : conforme aux attentes d'un binaire de dictée
# (vitesse d'inférence, taille).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

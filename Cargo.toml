[workspace]
resolver = "2"
members = [
    "crates/plume-core",
    "crates/plume-config",
    "crates/plume-audio",
    "crates/plume-asr",
    "crates/plume-text",
    "crates/plume-hotkeys",
    "crates/plume-storage",
    "crates/plume-secure",
    "crates/plume-license",
    "crates/plume-diagnostics",
    "crates/plume-win",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Plume"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Profil de release : conforme aux attentes d'un binaire de dictée
# (vitesse d'inférence, taille).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

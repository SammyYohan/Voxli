[package]
name = "plume-desktop"
description = "Application de bureau Plume : assemblage du noyau, tray natif, raccourci global, commandes IPC."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "plume-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }

# Téléchargement de modèles + empreinte SHA-256 (RF-20) : UNE action
# explicite de l'utilisateur, la seule voie réseau du produit (RF-36).
ureq = "2"
sha2 = "0.10"

plume-core = { path = "../../../crates/plume-core" }
plume-config = { path = "../../../crates/plume-config" }
plume-audio = { path = "../../../crates/plume-audio" }
plume-asr = { path = "../../../crates/plume-asr" }
plume-text = { path = "../../../crates/plume-text" }
plume-hotkeys = { path = "../../../crates/plume-hotkeys" }
plume-storage = { path = "../../../crates/plume-storage" }
plume-secure = { path = "../../../crates/plume-secure" }
plume-diagnostics = { path = "../../../crates/plume-diagnostics" }
plume-license = { path = "../../../crates/plume-license" }
plume-win = { path = "../../../crates/plume-win" }

# Moteur ASR réel — opt-in (voir README) :
[features]
default = []
real-asr = ["plume-asr/whisper"]
parakeet-asr = ["plume-asr/parakeet"]
# Historique sur disque chiffré DPAPI (RF-33) — opt-in explicite.
history-disk = ["plume-storage/secure-disk"]
# Embarquer l'interface construite (`../dist`) dans le binaire : OBLIGATOIRE
# pour lancer l'application sans serveur Vite (`pnpm dev`) — sans elle, les
# fenêtres affichent une page vide (mode dev → devUrl port 5173).
custom-protocol = ["tauri/custom-protocol"]


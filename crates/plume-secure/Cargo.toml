[package]
name = "plume-secure"
description = "Secrets : DPAPI / Credential Manager (ADR-07) — jamais dans le JSON ni le webview."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[features]
default = []
dpapi = []

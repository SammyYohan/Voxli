[package]
name = "voxli-asr"
description = "Moteurs de transcription derrière le trait Transcriptor : whisper.cpp (FFI), Parakeet ONNX, Nemotron 3.5 streaming, moteur factice de test."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
voxli-core = { path = "../voxli-core" }
thiserror = { workspace = true }
serde_json = { workspace = true }

# Real engine — explicitly enabled with the `whisper` feature: the build
# embeds whisper.cpp through CMake; see scripts/fetch-model.ps1.
whisper-rs = { version = "0.16", optional = true }

# Parakeet TDT v3 (P3) through the official crate: 100 % local, CC-BY-4.0
# weights; the C++ build requires CMake.
sherpa-onnx = { version = "1.13", optional = true }

# Remote BYOK engine (P4, RF-36): minimal HTTPS multipart transport.
ureq = { version = "2", optional = true, features = ["tls"] }

# Nemotron 3.5 ASR streaming (NeMo-Speech.cpp SDK, ADR-06): optional
# linkage, the SDK must be installed locally (README § 6).
voxli-win = { path = "../voxli-win", optional = true }

[features]
default = []
whisper = ["dep:whisper-rs"]
# Optional GPU acceleration for the whisper.cpp engine: compiles ggml with
# the Vulkan backend (Intel/AMD/NVIDIA drivers; CUDA follows the same
# pattern). The nominal build stays CPU-only: on machines that have one,
# the GPU is an additional OPPORTUNITY, never a constraint (build
# prerequisites: Vulkan SDK/glslc, see README § 6).
whisper-gpu = ["whisper", "whisper-rs/vulkan"]
parakeet = ["dep:sherpa-onnx"]
remote = ["dep:ureq"]
nemo-stream = ["dep:voxli-win", "voxli-win/nemo"]

[package]
name = "voxli-asr"
description = "Moteurs de transcription derrière le trait Transcriptor : whisper.cpp (FFI), Parakeet ONNX, Nemotron 3.5 streaming, moteur factice de test."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
voxli-core = { path = "../voxli-core" }
thiserror = { workspace = true }
serde_json = { workspace = true }

# Moteur réel — activé explicitement (feature `whisper`) : la compilation
# embarque whisper.cpp via CMake ; voir scripts/fetch-model.ps1.
whisper-rs = { version = "0.16", optional = true }

# Parakeet TDT v3 (P3) via la crate officielle : 100 % local, poids
# CC-BY-4.0 ; la compilation C++ requiert CMake.
sherpa-onnx = { version = "1.13", optional = true }

# Moteur distant BYOK (P4, RF-36) : transport HTTPS multipart minimal.
ureq = { version = "2", optional = true, features = ["tls"] }

# Nemotron 3.5 ASR streaming (SDK NeMo-Speech.cpp, ADR-06) : liaison
# optionnelle, l'installation locale du SDK est requise (README § 6).
voxli-win = { path = "../voxli-win", optional = true }

[features]
default = []
whisper = ["dep:whisper-rs"]
# Accélération GPU optionnelle du moteur whisper.cpp : compile ggml avec
# le backend Vulkan (pilotes Intel/AMD/NVIDIA ; le contrôle CUDA suit le
# même schéma). Le build nominal reste CPU-only : le GPU est une
# OPPORTUNITÉ de plus sur les machines qui en possèdent, jamais une
# contrainte (prérequis au build : SDK Vulkan/glslc, voir README § 6).
whisper-gpu = ["whisper", "whisper-rs/vulkan"]
parakeet = ["dep:sherpa-onnx"]
remote = ["dep:ureq"]
nemo-stream = ["dep:voxli-win", "voxli-win/nemo"]

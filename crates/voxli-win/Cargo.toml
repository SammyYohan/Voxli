[package]
name = "voxli-win"
description = "Interop Win32 isolée (ADR-06, docs/05 § 6) : presse-papiers, SendInput, fenêtre active, UIA. Seul module autorisé à faire de l'unsafe."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }

[features]
default = []
# NeMo-Speech.cpp: linkage to the locally installed C SDK (see build.rs and
# README § 6). Off by default: the nominal build stays green without the SDK.
nemo = []

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Security",
] }
